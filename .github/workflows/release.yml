name: 手动构建浏览器扩展

on: workflow_dispatch

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - name: 获取源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: 使用 Node.js 24.15.0
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.15.0'
          package-manager-cache: false
      - name: 启用项目指定的 Yarn
        run: corepack enable
      - name: 按锁文件安装依赖
        run: corepack yarn install --immutable
      - name: 构建浏览器扩展
        run: corepack yarn build
      - name: 附上许可证与素材来源
        run: |
          cp LICENSE README_UPSTREAM.md dist/
          cp src/assets/official-ai/README.md dist/AI_LOGO_SOURCES.md
          cp src/assets/official-ai/sources.json dist/AI_LOGO_SOURCES.json
      - name: 保存扩展构建产物
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: duozhi-workbench-extension
          path: dist/
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
